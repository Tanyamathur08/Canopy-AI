    stroke-opacity="0.8"
  />

  <!-- Central AI Spark -->
  <path
    d="M27.5 19.5 Q27.5 24 32 24 Q27.5 24 27.5 28.5 Q27.5 24 23 24 Q27.5 24 27.5 19.5 Z"
    fill="#FDE047"
  />
  <circle cx="27.5" cy="24" r="1.3" fill="#FFFFFF" />
</svg>