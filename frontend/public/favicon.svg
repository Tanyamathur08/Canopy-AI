<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favForestTrunk" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="favCanopyNodes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- Forest Black Base -->
  <rect width="100" height="100" rx="26" fill="#060A07" />

  <!-- Trunk & Circuit Branches -->
  <path d="M 50 78 V 44" stroke="url(#favForestTrunk)" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 43 53 L 50 60 L 57 53" stroke="url(#favForestTrunk)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 43 78 V 62 L 32 51 H 23" stroke="url(#favForestTrunk)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 32 51 V 44" stroke="url(#favForestTrunk)" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 57 78 V 62 L 68 51 H 77" stroke="url(#favForestTrunk)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68 51 V 44" stroke="url(#favForestTrunk)" stroke-width="4.2" stroke-linecap="round" />

  <!-- Constellation Edges -->
  <g stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="50" y1="36" x2="50" y2="24" />
    <line x1="50" y1="36" x2="39" y2="27" />
    <line x1="50" y1="36" x2="61" y2="27" />
    <line x1="39" y1="27" x2="41" y2="40" />
    <line x1="41" y1="40" x2="32" y2="36" />
    <line x1="32" y1="36" x2="23" y2="35" />
    <line x1="23" y1="35" x2="23" y2="44" />
    <line x1="23" y1="44" x2="14" y2="50" />
    <line x1="61" y1="27" x2="59" y2="40" />
    <line x1="59" y1="40" x2="68" y2="36" />
    <line x1="68" y1="36" x2="77" y2="35" />
    <line x1="77" y1="35" x2="77" y2="44" />
    <line x1="77" y1="44" x2="86" y2="50" />
  </g>

  <!-- Constellation Nodes -->
  <g fill="url(#favCanopyNodes)">
    <circle cx="50" cy="24" r="3.6" />
    <circle cx="50" cy="36" r="5.2" />
    <circle cx="39" cy="27" r="4.2" />
    <circle cx="61" cy="27" r="4.2" />
    <circle cx="41" cy="40" r="3.2" />
    <circle cx="59" cy="40" r="3.2" />
    <circle cx="32" cy="36" r="5.6" />
    <circle cx="68" cy="36" r="5.6" />
    <circle cx="23" cy="35" r="3.4" />
    <circle cx="77" cy="35" r="3.4" />
    <circle cx="23" cy="44" r="3.4" />
    <circle cx="77" cy="44" r="3.4" />
    <circle cx="14" cy="50" r="4.6" />
    <circle cx="86" cy="50" r="4.6" />
  </g>
