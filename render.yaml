# Render Blueprint Specification for Canopy AI
# Deploy for free on https://dashboard.render.com/blueprints

services:
  # 1. FastAPI Python Backend Web Service (Free Tier)
  - type: web
    name: canopy-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # 2. React + Vite Static Frontend (Render Static Sites are free by default)
  - type: web
    name: canopy-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: canopy-ai-backend
          type: web
          property: host
