# Render Blueprint Specification for Canopy AI
# Deploy with 1-click on https://dashboard.render.com/blueprints

services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: canopy-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # 2. React + Vite Static Frontend (Render type: web with runtime: static)
  - type: web
    name: canopy-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: canopy-ai-backend
          type: web
          property: host
